<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dapur Ozi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">
    
    <!-- Pengaman Sederhana -->
    <div id="login-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6">
        <h2 class="text-2xl font-black mb-4">Masuk Panel Admin</h2>
        <input type="password" id="pin-input" placeholder="Masukkan PIN" class="border-2 border-gray-300 rounded-xl p-3 text-center text-xl mb-4 w-full max-w-xs focus:outline-none focus:border-black">
        <button onclick="cekPin()" class="bg-black text-white font-bold py-3 px-8 rounded-xl w-full max-w-xs">Masuk</button>
        <p class="text-gray-400 text-sm mt-4">*(Hint PIN default: 1234)*</p>
    </div>

    <!-- Header -->
    <header class="bg-black text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tight">Panel Nyokap</h1>
        <button onclick="location.reload()" class="bg-gray-800 p-2 rounded-lg text-sm font-bold">Refresh Data</button>
    </header>

    <main class="max-w-md mx-auto p-4 hidden" id="admin-content">
        
        <!-- Dashboard Keuangan Bulan Ini -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6">
            <h2 class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">Performa Bulan Ini</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-green-50 p-3 rounded-xl border border-green-100">
                    <p class="text-xs text-green-600 font-semibold mb-1">Total Omset</p>
                    <p class="text-lg font-black text-green-700" id="stat-omset">Rp 0</p>
                </div>
                <div class="bg-red-50 p-3 rounded-xl border border-red-100">
                    <p class="text-xs text-red-600 font-semibold mb-1">Total Modal (HPP)</p>
                    <p class="text-lg font-black text-red-700" id="stat-modal">Rp 0</p>
                </div>
            </div>
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex justify-between items-center">
                <p class="text-sm text-blue-800 font-bold">Profit Bersih</p>
                <p class="text-xl font-black text-blue-900" id="stat-profit">Rp 0</p>
            </div>
        </section>

        <!-- Manajemen Produk -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-gray-900">Manajemen Stok & Harga</h2>
            </div>
            <div id="admin-katalog">
                <div class="text-center py-10 text-gray-400">Memuat data mesin...</div>
            </div>
        </section>
    </main>

    <script>
        // Konfigurasi Database lo yang kemaren
        const supabaseUrl = 'https://ywrvgclnxgtgidvmwgvs.supabase.co';
        const supabaseKey = 'sb_publishable_OZth7ZVCHh-BnWQQKOhBHg_4dyOSj3l';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let listProduk = [];

        // Logika Pengaman Sederhana (Front-end PIN)
        function cekPin() {
            const pin = document.getElementById('pin-input').value;
            // Gue set 1234 biar gampang. Nanti lo ajarin nyokap masukin ini.
            if(pin === '1234') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                initAdmin();
            } else {
                alert('PIN Salah, Deg!');
            }
        }

        async function initAdmin() {
            await loadDashboard();
            await loadKatalog();
        }

        // 1. Narik Data Keuangan Bulan Ini
        async function loadDashboard() {
            const date = new Date();
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).toISOString();

            const { data, error } = await db
                .from('rekap_harian')
                .select('*')
                .gte('tanggal', firstDay);

            if (error) return console.error(error);

            let omset = 0, modal = 0;
            data.forEach(row => {
                omset += row.total_omset;
                modal += row.total_hpp;
            });

            document.getElementById('stat-omset').innerText = `Rp ${omset.toLocaleString('id-ID')}`;
            document.getElementById('stat-modal').innerText = `Rp ${modal.toLocaleString('id-ID')}`;
            document.getElementById('stat-profit').innerText = `Rp ${(omset - modal).toLocaleString('id-ID')}`;
        }

        // 2. Narik Data Katalog Produk
        async function loadKatalog() {
            const { data, error } = await db
                .from('katalog_produk')
                .select('*')
                .order('id', { ascending: true });

            if (error) return console.error(error);
            listProduk = data;
            renderAdminKatalog();
        }

        // 3. Render UI Katalog buat Nyokap
        function renderAdminKatalog() {
            const container = document.getElementById('admin-katalog');
            let html = '';

            listProduk.forEach(p => {
                html += `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 mb-4 ${!p.is_active ? 'bg-gray-50' : ''}">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-gray-900 leading-tight ${!p.is_active ? 'line-through text-gray-400' : ''}">${p.nama_produk}</h3>
                            <p class="text-xs text-gray-500 mt-1">Jual: Rp${p.harga_jual.toLocaleString('id-ID')} | HPP: Rp${p.hpp.toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="toggleActive(${p.id}, ${p.is_active})" class="text-xs font-bold px-3 py-1 rounded-lg ${p.is_active ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                            ${p.is_active ? 'Sembunyikan' : 'Tampilkan'}
                        </button>
                    </div>

                    <div class="flex items-center justify-between border-t border-gray-100 pt-3 mt-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-medium text-gray-600">Sisa Stok:</span>
                            <button onclick="updateStok(${p.id}, ${p.sisa_kuota})" class="bg-gray-100 px-3 py-1 rounded-lg font-bold text-lg">${p.sisa_kuota}</button>
                        </div>
                        
                        <button onclick="catatLunas(${p.id})" class="bg-black text-white text-sm font-bold px-4 py-2 rounded-xl shadow active:scale-95 transition-transform" ${!p.is_active || p.sisa_kuota < 1 ? 'disabled style="opacity:0.5"' : ''}>
                            + Catat Lunas
                        </button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        // --- FUNGSI MESIN OPERASIONAL NYOKAP --- //

        // Mati/Nyalain Produk di Etalase Pembeli
        async function toggleActive(id, currentStatus) {
            const { error } = await db.from('katalog_produk').update({ is_active: !currentStatus }).eq('id', id);
            if(!error) loadKatalog(); // Refresh UI
        }

        // Update Sisa Kuota/Stok manual
        async function updateStok(id, currentStok) {
            const input = prompt("Masukkan jumlah stok/kuota baru:", currentStok);
            if (input !== null && input !== "") {
                const newStok = parseInt(input);
                if (!isNaN(newStok)) {
                    const { error } = await db.from('katalog_produk').update({ sisa_kuota: newStok }).eq('id', id);
                    if(!error) loadKatalog();
                }
            }
        }

        // Inti Sistem: Pas pembeli WA udah transfer, pencet ini!
        async function catatLunas(id) {
            const p = listProduk.find(x => x.id === id);
            const qty = prompt(`Berapa box/toples ${p.nama_produk} yang lunas barusan?`, "1");
            
            if (qty !== null && qty !== "") {
                const jumlahBeli = parseInt(qty);
                if (isNaN(jumlahBeli) || jumlahBeli <= 0) return alert("Angkanya nggak valid.");
                if (jumlahBeli > p.sisa_kuota) return alert("Stok nggak cukup buat dicatat segitu.");

                const konfirmasi = confirm(`Catat penjualan ${jumlahBeli}x ${p.nama_produk}? \nOmset masuk: Rp ${(jumlahBeli * p.harga_jual).toLocaleString('id-ID')}`);
                
                if (konfirmasi) {
                    // 1. Kurangin stok di katalog
                    await db.from('katalog_produk').update({ sisa_kuota: p.sisa_kuota - jumlahBeli }).eq('id', id);

                    // 2. Tambahin pemasukan ke rekap harian
                    const d = new Date();
                    // Setup format YYYY-MM-DD
                    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    
                    const omsetMasuk = jumlahBeli * p.harga_jual;
                    const hppMasuk = jumlahBeli * p.hpp;

                    await db.from('rekap_harian').insert([{
                        tanggal: todayStr,
                        total_omset: omsetMasuk,
                        total_hpp: hppMasuk
                    }]);

                    alert("Berhasil dicatat!");
                    initAdmin(); // Refresh semua data (Stok turun, Omset naik)
                }
            }
        }
    </script>
</body>
</html>
